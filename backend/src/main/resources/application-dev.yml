# Dev profile
spring:
  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/laundry_db
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: laundry_redis_pass
      timeout: 5000

  # JPA dev overrides
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  # Flyway
  flyway:
    clean-disabled: false

# Logging dev overrides
logging:
  level:
    com.bubbleflow: DEBUG
    org.hibernate.SQL: DEBUG
